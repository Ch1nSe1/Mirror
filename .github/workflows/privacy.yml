name: privacy

# 隐私门禁（2026-11-21）
# 两层：① gitleaks 全历史扫密钥/凭据；② 自写扫描器按私人词表扫已跟踪文件。
# 私人词表来自仓库 Settings → Secrets → Actions 的 PRIVATE_TERMS（一行一个），
# **绝不能**把词表提交进仓库，否则扫描器本身就成了泄露源。

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（全历史，gitleaks 需要）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks 全历史扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 私人词表扫描
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
        run: |
          if [ -z "$PRIVATE_TERMS" ]; then
            echo "未配置 PRIVATE_TERMS，跳过私人词表扫描"
            exit 0
          fi
          node scripts/privacy-scan.mjs --all
